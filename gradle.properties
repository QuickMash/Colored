group=cc.quickmash
version=1.0.0

# If CI=true, use CI run number (or fallback) as a suffix: 1.0.0-ci.<id>
versionSuffix=-ci.${System.getenv("GITHUB_RUN_NUMBER") ?: System.getenv("CI_PIPELINE_IID") ?: System.getenv("BUILD_NUMBER") ?: "local"}
isCi=${System.getenv("CI") == "true" || System.getenv("GITHUB_ACTIONS") == "true"}
effectiveVersion=${isCi ? version + versionSuffix : version}

description=Color your chat with legacy color codes
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
