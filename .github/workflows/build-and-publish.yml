name: Build and Publish Plugin

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin for release tag
        run: ./gradlew clean verifySingleReleaseJar --no-daemon -PreleaseVersion="${RELEASE_VERSION}"

      # Pick exactly one JAR and fail if ambiguous/missing.
      - name: Resolve release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Exclude common non-release jars. Adjust if your naming differs.
          jars=(build/libs/*.jar)
          filtered=()
          for f in "${jars[@]}"; do
            case "$f" in
              *-sources.jar|*-javadoc.jar|*-dev.jar|*-plain.jar) ;;
              *) filtered+=("$f") ;;
            esac
          done

          if [ "${#filtered[@]}" -eq 0 ]; then
            echo "No publishable JAR found in build/libs"
            ls -la build/libs || true
            exit 1
          fi

          if [ "${#filtered[@]}" -gt 1 ]; then
            echo "Multiple publishable JARs found; refusing to guess:"
            printf ' - %s\n' "${filtered[@]}"
            exit 1
          fi

          echo "jar_path=${filtered[0]}" >> "$GITHUB_OUTPUT"
          echo "Selected artifact: ${filtered[0]}"

      - name: Upload to Modrinth
        uses: modrinth/action-publish@v3
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project_id: colored
          version_number: ${{ env.RELEASE_VERSION }}
          version_name: Release ${{ env.RELEASE_VERSION }}
          changelog: ${{ github.event.release.body }}
          files: ${{ steps.artifact.outputs.jar_path }}

      - name: Upload to Hangar
        uses: HangarMC/hangar-publish-action@v1
        with:
          api_key: ${{ secrets.HANGAR_TOKEN }}
          project_id: QuickMash/Colored
          version: ${{ env.RELEASE_VERSION }}
          channel: Release
          changelog: ${{ github.event.release.body }}
          files: ${{ steps.artifact.outputs.jar_path }}
